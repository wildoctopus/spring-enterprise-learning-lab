name: Documentation or example bug
description: Report an incorrect explanation, broken command, failing example, or missing link.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the problem. Security-sensitive reports should not be opened publicly.
  - type: input
    id: location
    attributes:
      label: Location
      description: Which file, section, class, or command is affected?
      placeholder: README.md - cursor pagination example
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior or documentation.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, Java/Maven versions, and a minimal reproduction where relevant.
      render: shell
  - type: textarea
    id: proposed-fix
    attributes:
      label: Suggested correction
      description: Optional. Explain what should change and why.
